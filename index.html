<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="css/style.css" />
    <title>Music App</title>
  </head>
  <body>
    <header>
      <form id="form">
        <input type="text" id="search" class="search" placeholder="search artist or song">
      </form>
    </header>

    <main id="main">
      <div class="song">
        <img src="image/cover.svg" alt="">
        <div class="song-info">
          <h3>Song title</h3>
          <p>Artist name</p>
        </div>
      </div>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
